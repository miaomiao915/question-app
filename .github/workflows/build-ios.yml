name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Verify dist folder
        run: ls -la dist

      - name: Install Capacitor dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios

      - name: Check iOS structure
        run: find ios -name "*.xcworkspace" -o -name "*.xcodeproj"

      - name: Sync to iOS
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p ios/App/output/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/output/Payload/
          cd ios/App/output
          zip -r QuestionApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuestionApp-ipa
          path: ios/App/output/QuestionApp.ipa